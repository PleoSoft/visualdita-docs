name: Feature request
description: Something the editor should do, or should do differently
labels: ["enhancement"]
body:
  - type: textarea
    id: what
    attributes:
      label: What you would like to do
      description: The writing task, not the button. What are you trying to get done?
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: In Visual DITA, in Oxygen, in another editor, or by hand.
  - type: input
    id: doctype
    attributes:
      label: Document type
      description: Relevant when the request is about a specific DITA element or specialization.
